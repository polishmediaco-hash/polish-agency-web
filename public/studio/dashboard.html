<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POLISH Studio — Executive Boards Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-gold-mark.svg">
  <link rel="alternate icon" type="image/png" href="/assets/logo-gold.png">
  <style>
    :root {
      --brand-gold: #C5A880;
      --brand-gold-bright: #E2C799;
      --brand-noir: #080706;
      --surface-alabaster: #FAF7F2;
      --surface-white: #FFFFFF;
      --surface-card: #FFFFFF;
      --surface-subtle: #F5F1EB;
      --surface-subtle-hover: #ECE6DD;
      --text-ink: #1A1715;
      --text-slate: #3F3C39;
      --text-muted: #736D67;
      --border-subtle: #E8E2D8;
      --border-strong: #D5CEC4;
      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

    body {
      background-color: var(--surface-alabaster);
      background-image: radial-gradient(rgba(197, 168, 128, 0.22) 1.25px, transparent 1.25px);
      background-size: 32px 32px;
      font-family: var(--font-heading);
      color: var(--text-ink);
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .dashboard-container {
      max-width: 1240px;
      margin: 0 auto;
    }

    /* Header Nav (Haute Atelier Light) */
    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3.5rem;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 0.85rem 1.75rem;
      box-shadow: 0 10px 30px rgba(26, 23, 21, 0.05);
      gap: 1.5rem;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-ink);
      font-weight: 800;
    }

    .brand-logo-mark {
      width: 34px;
      height: 34px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(226, 199, 153, 0.45));
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
    }

    .brand-cluster:hover .brand-logo-mark {
      transform: scale(1.06);
      filter: drop-shadow(0 0 16px rgba(226, 199, 153, 0.75));
    }

    .brand-text-lockup {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      line-height: 1;
    }

    .brand-name {
      letter-spacing: 0.08em;
      font-weight: 900;
      font-size: 1.05rem;
      color: #1A1715;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 0.54rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #7A5E32;
      line-height: 1;
    }

    .dash-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-capsule {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px 5px 6px;
      border-radius: 30px;
      background: var(--surface-subtle);
      border: 1px solid var(--border-subtle);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-slate);
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #080706;
      color: #F5E6D3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .btn-signout {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .btn-signout:hover {
      color: #BE123C;
      background: #FFF1F2;
    }

    .btn {
      padding: 9px 18px;
      border-radius: 24px;
      font-family: var(--font-heading);
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:focus-visible {
      outline: 2px solid var(--brand-gold);
      outline-offset: 2px;
    }

    .btn-primary {
      background: #080706;
      color: #F5E6D3;
      border: 1px solid #080706;
    }

    .btn-primary:hover {
      background: #1A1715;
      color: #FFFFFF;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(8, 7, 6, 0.2);
    }

    .btn-secondary {
      background: #FFFFFF;
      color: var(--text-ink);
      border: 1px solid var(--border-subtle);
    }

    .btn-secondary:hover {
      background: var(--surface-subtle);
      border-color: var(--brand-gold);
      transform: translateY(-1px);
    }

    /* Page Titles */
    .title-row {
      margin-bottom: 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .eyebrow {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brand-gold);
      margin-bottom: 0.5rem;
    }

    .headline {
      font-size: 2.25rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--text-ink);
    }

    .headline .serif-accent {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--brand-gold);
      font-weight: 700;
    }

    .workspace-meta-capsule {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(197, 168, 128, 0.35);
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-slate);
      box-shadow: 0 4px 14px rgba(26, 23, 21, 0.04), inset 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    .workspace-meta-capsule .meta-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }

    /* Boards Grid */
    .boards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.75rem;
    }

    .board-card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(197, 168, 128, 0.32);
      border-radius: 24px;
      padding: 1.35rem;
      box-shadow: 0 12px 32px rgba(26, 23, 21, 0.05), inset 0 1px 2px rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s, border-color 0.22s;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .board-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 50px -8px rgba(26, 23, 21, 0.12), 0 0 24px rgba(197, 168, 128, 0.16), inset 0 1px 2px rgba(255, 255, 255, 1);
      border-color: rgba(197, 168, 128, 0.65);
    }

    /* Miniature Canvas Preview */
    .card-canvas-preview {
      width: 100%;
      height: 124px;
      background: #FAF7F2;
      background-image: radial-gradient(rgba(197, 168, 128, 0.25) 1px, transparent 1px);
      background-size: 16px 16px;
      border: 1px solid rgba(197, 168, 128, 0.25);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      margin-bottom: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      transition: all 0.2s ease;
    }

    .card-canvas-preview:hover {
      border-color: var(--brand-gold);
      background-color: #F8F4EC;
    }

    .mini-frame-box {
      width: 95px;
      height: 76px;
      background: #FFFFFF;
      border: 1px solid rgba(232, 226, 216, 0.95);
      border-radius: 9px;
      padding: 7px 9px;
      box-shadow: 0 4px 10px rgba(26, 23, 21, 0.04);
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: none;
    }

    .mini-pill-tag {
      font-size: 0.48rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--brand-gold);
      text-transform: uppercase;
      line-height: 1;
    }

    .mini-bar-primary {
      height: 4.5px;
      border-radius: 2px;
      background: #1A1715;
      width: 82%;
    }

    .mini-bar-subtle {
      height: 3.5px;
      border-radius: 2px;
      background: #E8E2D8;
      width: 60%;
    }

    .mini-card-block {
      margin-top: 3px;
      height: 16px;
      border-radius: 4px;
      background: #FAF7F2;
      border: 1px solid #ECE6DD;
    }

    .preview-hover-overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 7, 6, 0.45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      border-radius: 15px;
    }

    .card-canvas-preview:hover .preview-hover-overlay {
      opacity: 1;
    }

    .preview-hover-pill {
      background: #FFFFFF;
      color: #080706;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 5px 13px;
      border-radius: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    /* Card Top Header & Actions */
    .card-top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.65rem;
      position: relative;
    }

    .board-metric-pill {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      background: var(--surface-subtle);
      border: 1px solid var(--border-subtle);
      padding: 3px 9px;
      border-radius: 20px;
      color: var(--text-slate);
    }

    .card-menu-container {
      position: relative;
    }

    .btn-card-menu {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      line-height: 1;
      transition: all 0.15s;
    }

    .btn-card-menu:hover {
      background: var(--surface-subtle);
      border-color: var(--border-subtle);
      color: var(--text-ink);
    }

    .card-menu-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(26, 23, 21, 0.12);
      padding: 6px;
      min-width: 180px;
      z-index: 100;
      display: none;
    }

    .card-menu-dropdown.active {
      display: block;
      animation: fadeInMenu 0.15s ease;
    }

    @keyframes fadeInMenu {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-item-action {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      background: transparent;
      border: none;
      font-family: var(--font-heading);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-slate);
      cursor: pointer;
      text-decoration: none;
      text-align: left;
      transition: all 0.12s;
    }

    .menu-item-action:hover {
      background: var(--surface-subtle);
      color: var(--text-ink);
    }

    .menu-item-action.danger:hover {
      background: #FFF1F2;
      color: #BE123C;
    }

    .board-card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-ink);
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      line-height: 1.3;
    }

    .board-card-client {
      font-size: 0.84rem;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 1.25rem;
    }

    .client-bullet {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--brand-gold);
      display: inline-block;
    }

    /* Streamlined Footer */
    .board-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 1.1rem;
      border-top: 1px solid var(--border-subtle);
      margin-top: auto;
      gap: 10px;
    }

    .board-date-label {
      font-family: var(--font-mono);
      font-size: 0.71rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-footer-ctas {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-card-share {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 20px;
      font-family: var(--font-heading);
      font-size: 0.76rem;
      font-weight: 700;
      background: #FAF7F2;
      border: 1px solid rgba(197, 168, 128, 0.45);
      color: #92400E;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-card-share:hover {
      background: #FEF8ED;
      border-color: #C5A880;
      transform: translateY(-1px);
    }

    .btn-card-open {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 15px;
      border-radius: 20px;
      font-family: var(--font-heading);
      font-size: 0.78rem;
      font-weight: 800;
      background: #080706;
      color: #F5E6D3;
      text-decoration: none;
      border: 1px solid #080706;
      transition: all 0.15s ease;
    }

    .btn-card-open:hover {
      background: #1A1715;
      color: #FFFFFF;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(8, 7, 6, 0.2);
    }

    /* Toast */
    .dash-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #080706;
      color: #F5E6D3;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.84rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      z-index: 2000;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dash-toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <!-- Header -->
    <header class="dash-header">
      <a href="/boards" class="brand-cluster" title="POLISH Board Studio">
        <img src="/assets/logo-gold-mark.svg?v=22.0" alt="POLISH" class="brand-logo-mark" width="34" height="34" />
        <div class="brand-text-lockup">
          <span class="brand-name">POLISH</span>
          <span class="brand-subtitle">BOARD STUDIO</span>
        </div>
      </a>

      <div class="dash-actions">
        <!-- User Account Profile Capsule -->
        <div id="userCapsule" class="user-capsule" style="display:none">
          <div id="userAvatar" class="user-avatar">AD</div>
          <span id="userName">Advisor</span>
          <button class="btn-signout" onclick="signOut()" title="Log out of this workspace">Sign Out</button>
        </div>

        <button class="btn btn-secondary" onclick="createFromTemplate()">+ Strategy Template</button>
        <button class="btn btn-primary" onclick="createBlankBoard()">+ Blank Canvas</button>
      </div>
    </header>

    <!-- Title -->
    <div class="title-row">
      <div>
        <div class="eyebrow">Atelier Whiteboards</div>
        <h1 class="headline">Strategic Client <span class="serif-accent">Canvases & Boards</span></h1>
      </div>
      <div class="workspace-meta-capsule">
        <span class="meta-dot"></span>
        <span id="workspaceStatsText">Private Haute Atelier Active</span>
      </div>
    </div>

    <!-- Grid of Boards -->
    <div id="boardsGrid" class="boards-grid">
      <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);">
        Loading private workspace boards...
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteConfirmModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(8,7,6,0.65); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); z-index:3000; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#FFFFFF; border:1px solid var(--border-subtle); border-radius:24px; max-width:440px; width:100%; padding:2rem; box-shadow:0 24px 60px rgba(0,0,0,0.25); text-align:center;">
      <div style="width:48px; height:48px; border-radius:50%; background:#FFF1F2; color:#BE123C; display:flex; align-items:center; justify-content:center; margin:0 auto 1.25rem auto;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      </div>
      <h3 style="font-family:var(--font-heading); font-size:1.25rem; font-weight:800; color:var(--text-ink); margin-bottom:0.5rem;">Delete Strategy Canvas?</h3>
      <p id="deleteConfirmText" style="font-size:0.86rem; color:var(--text-slate); line-height:1.5; margin-bottom:1.75rem;">Are you sure you want to delete this board? This action is permanent and cannot be undone.</p>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()" style="padding:10px 20px;">Keep Board</button>
        <button type="button" class="btn" onclick="confirmDeleteBoard()" style="background:#BE123C; color:#FFF; border:none; padding:10px 22px; border-radius:9999px; font-weight:700; cursor:pointer;">Delete Forever</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="dashToast" class="dash-toast">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    <span>Notification</span>
  </div>

  <!-- Firebase Web SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="/studio/js/firebase-config.js?v=20260909_v2"></script>

  <script>
    let activeUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await PolishFirebase.init();

      if (!PolishFirebase.currentUser) {
        // If unauthenticated, redirect to login cleanly
        window.location.replace('/login?redirect=/boards');
        return;
      }

      activeUser = PolishFirebase.currentUser;
      renderUserProfile(activeUser);
      loadUserBoards(activeUser.uid);

      PolishFirebase.onAuthStateChanged((user) => {
        if (!user) {
          window.location.replace('/login?redirect=/boards');
          return;
        }
        activeUser = user;
        renderUserProfile(user);
      });
    });

    function renderUserProfile(user) {
      const capsule = document.getElementById('userCapsule');
      const avatar = document.getElementById('userAvatar');
      const name = document.getElementById('userName');

      if (!capsule) return;
      capsule.style.display = 'flex';

      const displayName = user.displayName || user.email.split('@')[0];
      name.textContent = displayName;

      const initials = displayName
        .split(' ')
        .map(n => n[0])
        .join('')
        .toUpperCase()
        .slice(0, 2) || 'AD';
      avatar.textContent = initials;
    }

    async function signOut() {
      await PolishFirebase.logout();
      window.location.replace('/login');
    }

    async function loadUserBoards(userId) {
      try {
        const grid = document.getElementById('boardsGrid');
        const boards = await PolishFirebase.listBoards(userId);

        const statsEl = document.getElementById('workspaceStatsText');
        const count = boards ? boards.length : 0;
        if (statsEl) {
          statsEl.textContent = `${count} Active Blueprint${count === 1 ? '' : 's'}`;
        }

        if (!boards || boards.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 2rem; background:rgba(255,255,255,0.95); border-radius:24px; border:1px solid var(--border-subtle); box-shadow: 0 10px 30px rgba(26,23,21,0.03); backdrop-filter: blur(20px);">
              <div style="font-size:2.5rem; margin-bottom:1rem">✦</div>
              <h3 style="font-size:1.35rem; font-weight:800; margin-bottom:0.5rem; color:var(--text-ink)">Your Workspace is Ready</h3>
              <p style="color:var(--text-muted); max-width:440px; margin:0 auto 1.75rem auto; font-size:0.9rem">Create your first client strategy blueprint or start from our battle-tested executive template.</p>
              <button class="btn btn-primary" onclick="createFromTemplate()">+ Create Executive Blueprint</button>
            </div>
          `;
          return;
        }

        grid.innerHTML = boards.map(b => {
          const elemCount = b.elementCount || (b.elements ? b.elements.length : 0);
          const flowCount = b.connectionCount || (b.connections ? b.connections.length : 0);
          const updatedDate = new Date(b.updatedAt || Date.now()).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
          const safeTitle = escapeHtml(b.title || 'Untitled Blueprint');
          const safeClient = escapeHtml(b.client || 'Haute Advisory Client');
          const boardId = b.id;

          return `
          <div class="board-card" data-board-id="${boardId}">
            <!-- Interactive Visual Preview -->
            <div class="card-canvas-preview" onclick="window.location.href='/studio?id=${encodeURIComponent(boardId)}'" title="Open canvas in studio">
              <div class="mini-frame-box">
                <span class="mini-pill-tag">FOUNDATION</span>
                <div class="mini-bar-primary"></div>
                <div class="mini-bar-subtle"></div>
                <div class="mini-card-block"></div>
              </div>
              <div class="mini-frame-box">
                <span class="mini-pill-tag">OFFER</span>
                <div class="mini-bar-primary" style="width:70%"></div>
                <div class="mini-bar-subtle" style="width:85%"></div>
                <div class="mini-card-block" style="background:#FDFBF7"></div>
              </div>
              <div class="mini-frame-box" style="opacity:0.65">
                <span class="mini-pill-tag">PRICING</span>
                <div class="mini-bar-primary" style="width:60%"></div>
                <div class="mini-bar-subtle" style="width:40%"></div>
              </div>
              <div class="preview-hover-overlay">
                <span class="preview-hover-pill">Launch Editor →</span>
              </div>
            </div>

            <!-- Top Header & Actions Menu -->
            <div class="card-top-header">
              <span class="board-metric-pill">${elemCount} Elements • ${flowCount} Flows</span>
              <div class="card-menu-container">
                <button class="btn-card-menu" onclick="toggleCardMenu(event, '${boardId}')" title="More options" aria-label="More options">···</button>
                <div class="card-menu-dropdown" id="menu-${boardId}">
                  <a href="/b/${encodeURIComponent(boardId)}" target="_blank" class="menu-item-action">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    Client View ↗
                  </a>
                  <button class="menu-item-action" onclick="duplicateBoard('${boardId}')">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Duplicate Blueprint
                  </button>
                  <button class="menu-item-action danger" onclick="deleteBoard('${boardId}', '${safeTitle}')">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Delete Canvas
                  </button>
                </div>
              </div>
            </div>

            <!-- Title & Client Meta -->
            <h2 class="board-card-title">${safeTitle}</h2>
            <div class="board-card-client">
              <span class="client-bullet"></span>
              ${safeClient}
            </div>

            <!-- Streamlined Footer CTAs -->
            <div class="board-card-footer">
              <span class="board-date-label">${updatedDate}</span>
              <div class="card-footer-ctas">
                <button class="btn-card-share" onclick="copyClientLink('${boardId}')" title="Copy public client link">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                  Copy Link
                </button>
                <a href="/studio?id=${encodeURIComponent(boardId)}" class="btn-card-open">Open Canvas →</a>
              </div>
            </div>
          </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Error loading boards:', err);
      }
    }

    async function createBlankBoard() {
      if (!activeUser) return;
      const title = 'New Strategic Advisory Board';
      const boardId = `board-${Date.now().toString(36)}-${Math.random().toString(36).substring(2, 6)}`;
      const newBoard = {
        id: boardId,
        slug: boardId,
        title: title,
        client: 'Private Client',
        ownerId: activeUser.uid,
        ownerEmail: activeUser.email,
        viewport: { panX: 100, panY: 80, scale: 0.8 },
        elements: [
          {
            id: 'frame-1',
            type: 'frame',
            x: 120,
            y: 120,
            width: 600,
            height: 480,
            zIndex: 10,
            frameNumber: '01',
            titlePill: '',
            headline: 'Strategic Overview',
            serifAccent: '',
            description: '',
            boxes: [
              {
                tag: 'PHASE 01',
                tagColor: 'gold',
                title: 'Primary Strategic Objective',
                content: ''
              }
            ]
          }
        ],
        connections: []
      };

      await PolishFirebase.saveBoard(newBoard, activeUser);
      window.location.href = `/studio?id=${boardId}`;
    }

    async function createFromTemplate() {
      if (!activeUser) return;
      const client = 'Executive Advisory Client';
      const title = 'Executive Strategy Blueprint';
      const boardId = `board-${Date.now().toString(36)}-${Math.random().toString(36).substring(2, 6)}`;
      
      // Fetch starter template structure
      let starterData;
      try {
        const res = await fetch('/api/boards/starter-strategy-board');
        if (res.ok) {
          const data = await res.json();
          starterData = data.board;
        }
      } catch (e) {}

      const newBoard = {
        ...(starterData || {}),
        id: boardId,
        slug: boardId,
        title: title.trim(),
        client: (client || 'Private Client').trim(),
        ownerId: activeUser.uid,
        ownerEmail: activeUser.email,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      await PolishFirebase.saveBoard(newBoard, activeUser);
      window.location.href = `/studio?id=${boardId}`;
    }

    async function duplicateBoard(id) {
      if (!activeUser) return;
      const original = await PolishFirebase.getBoard(id);
      if (!original) return;

      const newId = `board-${Date.now().toString(36)}-${Math.random().toString(36).substring(2, 6)}`;
      const copy = {
        ...original,
        id: newId,
        slug: newId,
        title: `${original.title || 'Board'} (Copy)`,
        ownerId: activeUser.uid,
        ownerEmail: activeUser.email,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      await PolishFirebase.saveBoard(copy, activeUser);
      showToast('Board duplicated successfully!');
      loadUserBoards(activeUser.uid);
    }

    let boardToDeleteId = null;

    function deleteBoard(id, title) {
      boardToDeleteId = id;
      const modal = document.getElementById('deleteConfirmModal');
      const text = document.getElementById('deleteConfirmText');
      if (text) text.textContent = `Are you sure you want to delete "${title || 'this board'}"? This action is permanent and cannot be undone.`;
      if (modal) modal.style.display = 'flex';
    }

    function closeDeleteModal() {
      const modal = document.getElementById('deleteConfirmModal');
      if (modal) modal.style.display = 'none';
      boardToDeleteId = null;
    }

    async function confirmDeleteBoard() {
      if (!boardToDeleteId) return;
      const id = boardToDeleteId;
      closeDeleteModal();
      await PolishFirebase.deleteBoard(id);
      showToast('Board deleted successfully.');
      if (activeUser) loadUserBoards(activeUser.uid);
    }

    function copyClientLink(id) {
      const url = `${window.location.origin}/b/${encodeURIComponent(id)}`;
      navigator.clipboard.writeText(url).then(() => {
        showToast('Client presentation link copied!');
      }).catch(() => {
        showToast('Link: ' + url);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('dashToast');
      if (!toast) return;
      toast.querySelector('span').textContent = msg;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2800);
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    function toggleCardMenu(e, id) {
      e.stopPropagation();
      const menu = document.getElementById(`menu-${id}`);
      const wasActive = menu && menu.classList.contains('active');
      closeAllCardMenus();
      if (menu && !wasActive) {
        menu.classList.add('active');
      }
    }

    function closeAllCardMenus() {
      document.querySelectorAll('.card-menu-dropdown.active').forEach(m => m.classList.remove('active'));
    }

    document.addEventListener('click', () => {
      closeAllCardMenus();
    });
  </script>
</body>
</html>
