<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POLISH Studio — Executive Workspace Login</title>
  <script>
    // Instant 0ms session recovery: redirect immediately if already logged in
    try {
      var u = JSON.parse(localStorage.getItem('polish_studio_user') || 'null');
      if (u && (u.uid || u.email)) {
        var r = new URLSearchParams(window.location.search).get('redirect') || '/boards';
        if (r === '/login' || r.startsWith('/login')) r = '/boards';
        window.location.replace(r);
      }
    } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-gold-mark.svg">
  <link rel="alternate icon" type="image/png" href="/assets/logo-gold.png">
  <style>
    :root {
      --brand-gold: #C5A880;
      --brand-gold-bright: #E2C799;
      --brand-noir: #080706;
      --surface-alabaster: #FAF7F2;
      --surface-white: #FFFFFF;
      --surface-card: #FFFFFF;
      --surface-subtle: #F5F1EB;
      --text-ink: #1A1715;
      --text-slate: #3F3C39;
      --text-muted: #736D67;
      --border-subtle: #E8E2D8;
      --border-strong: #D5CEC4;
      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

    body {
      background-color: var(--surface-alabaster);
      background-image: radial-gradient(rgba(197, 168, 128, 0.22) 1.25px, transparent 1.25px);
      background-size: 32px 32px;
      font-family: var(--font-heading);
      color: var(--text-ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(197, 168, 128, 0.32);
      border-radius: 28px;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 24px 60px rgba(26, 23, 21, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.95), 0 0 0 1px rgba(197, 168, 128, 0.28);
    }

    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-squircle {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #080706;
      border: 1px solid rgba(226, 199, 153, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .brand-squircle svg {
      width: 32px;
      height: 32px;
    }

    .auth-title {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-ink);
      letter-spacing: -0.01em;
    }

    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    /* Auth Tabs */
    .auth-error {
      display: none;
      padding: 10px 14px;
      border-radius: 12px;
      background: #FFF1F2;
      border: 1px solid #FDA4AF;
      color: #BE123C;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: left;
      line-height: 1.4;
    }

    /* Primary Luxury Google Button */
    .btn-google-primary {
      width: 100%;
      padding: 14px 20px;
      border-radius: 16px;
      background: #080706;
      color: #F5E6D3;
      border: 1px solid rgba(197, 168, 128, 0.45);
      font-family: var(--font-heading);
      font-size: 0.94rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 6px 20px rgba(8, 7, 6, 0.16);
      user-select: none;
    }

    .btn-google-primary:hover {
      background: #1A1715;
      color: #FFFFFF;
      border-color: var(--brand-gold-bright);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(8, 7, 6, 0.26);
    }

    .btn-google-primary:active {
      transform: translateY(0);
    }

    .google-icon-chip {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
    }

    .auth-footer-notice {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .auth-shield-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--brand-gold);
      font-weight: 700;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <img src="/assets/logo-gold-mark.svg?v=22.0" alt="POLISH" class="brand-logo-mark" width="46" height="46" style="filter: drop-shadow(0 0 12px rgba(226, 199, 153, 0.45)); margin-bottom: 12px;" />
      <div class="brand-text-lockup" style="display: flex; flex-direction: column; align-items: center; gap: 3px; line-height: 1;">
        <span class="brand-name" style="font-size: 1.25rem; font-weight: 800; letter-spacing: 0.10em; color: var(--brand-noir);">POLISH</span>
        <span class="brand-subtitle" style="font-size: 0.58rem; font-weight: 700; letter-spacing: 0.20em; text-transform: uppercase; color: #7A5E32;">BOARD STUDIO</span>
      </div>
    </div>

    <div id="authError" class="auth-error"></div>

    <button type="button" id="btnGoogleSignIn" class="btn-google-primary" onclick="handleGoogleSignIn()">
      <div class="google-icon-chip">
        <svg width="17" height="17" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.16 0 9.98 0 12s.46 3.84 1.26 5.42l4.02-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
      </div>
      <span id="btnGoogleText">Continue with Google</span>
    </button>

    <div style="margin: 1.25rem 0 0.85rem; text-align: center; position: relative;">
      <div style="height: 1px; background: var(--border-subtle); width: 100%;"></div>
      <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #FFFFFF; padding: 0 12px; font-size: 0.68rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.10em;">OR</span>
    </div>

    <button type="button" class="btn-offline-entry" onclick="handleOfflineEntry()" style="width: 100%; padding: 12px 18px; border-radius: 14px; background: #FAF7F2; color: #1A1715; border: 1px solid var(--border-subtle); font-family: var(--font-heading); font-size: 0.86rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.15s ease;" onmouseover="this.style.background='#F5EFE6'" onmouseout="this.style.background='#FAF7F2'">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
      Offline Mode
    </button>
  </div>

  <!-- Firebase Web SDK (Lightweight Auth Only — zero firestore overhead) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="/studio/js/firebase-config.js?v=20260909_fast"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Instant zero-delay initialization
      PolishFirebase.init();

      // Check if arriving from full-page redirect
      if (PolishFirebase.auth && PolishFirebase.auth.getRedirectResult) {
        try {
          const res = await PolishFirebase.auth.getRedirectResult();
          if (res && res.user) {
            let redirect = new URLSearchParams(window.location.search).get('redirect') || '/boards';
            if (redirect === '/login' || redirect.startsWith('/login')) redirect = '/boards';
            window.location.replace(redirect);
            return;
          }
        } catch (e) {
          console.warn('[Login] Redirect check:', e);
        }
      }

      if (PolishFirebase.currentUser) {
        let redirect = new URLSearchParams(window.location.search).get('redirect') || '/boards';
        if (redirect === '/login' || redirect.startsWith('/login')) redirect = '/boards';
        window.location.replace(redirect);
      }
    });

    function handleOfflineEntry() {
      PolishFirebase.loginOffline('Executive Advisor');
      let redirect = new URLSearchParams(window.location.search).get('redirect') || '/boards';
      if (redirect === '/login' || redirect.startsWith('/login')) redirect = '/boards';
      window.location.href = redirect;
    }

    async function handleGoogleSignIn(mode) {
      const authError = document.getElementById('authError');
      const btn = document.getElementById('btnGoogleSignIn');
      const text = document.getElementById('btnGoogleText');
      
      authError.style.display = 'none';
      btn.style.opacity = '0.75';
      btn.style.pointerEvents = 'none';
      text.textContent = mode === 'redirect' ? 'Redirecting to Google...' : 'Connecting to Google...';

      try {
        if (mode === 'redirect') {
          if (!PolishFirebase.auth) await PolishFirebase.init();
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.addScope('profile');
          provider.addScope('email');
          provider.setCustomParameters({ prompt: 'select_account' });
          await PolishFirebase.auth.signInWithRedirect(provider);
          return;
        }

        const user = await PolishFirebase.loginWithGoogle();
        if (!user) {
          text.textContent = 'Redirecting to Google...';
          return;
        }
        const redirect = new URLSearchParams(window.location.search).get('redirect') || '/boards';
        window.location.href = redirect;
      } catch (err) {
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
        text.textContent = 'Continue with Google';
        console.error('[Login] Google auth error:', err);

        let msg = err.message || 'Google Sign-In could not be completed.';
        if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/popup-blocked') {
          msg = `Sign-in popup was closed or blocked.<div style="margin-top:10px;"><button type="button" onclick="handleGoogleSignIn('redirect')" style="background:#080706;border:1px solid rgba(197,168,128,0.45);color:#F5E6D3;padding:8px 18px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;">Continue with Direct Google Sign-In &rarr;</button></div>`;
        } else if (err.code === 'auth/unauthorized-domain') {
          msg = 'Domain not authorized in Firebase Auth. You can use Offline Mode below.';
        }
        authError.innerHTML = msg;
        authError.style.display = 'block';
      }
    }
  </script>
</body>
</html>
