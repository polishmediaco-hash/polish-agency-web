<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 604" width="710" height="604">
  <defs>
    <linearGradient id="champagneGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880"/>
      <stop offset="45%" stop-color="#E2C799"/>
      <stop offset="70%" stop-color="#F5E6D3"/>
      <stop offset="100%" stop-color="#E2C799"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Group centered for the mark (scale and translate based on favicon path) -->
  <g transform="translate(105, -30) scale(5.0)">
    <!-- Arrow Stem & Head -->
    <path d="M 32 72 L 28 68 C 26 66 26 62 28 60 L 52 36 L 46 36 C 44 36 42 34 42 32 C 42 30 44 28 46 28 L 68 28 C 70 28 72 30 72 32 L 72 54 C 72 56 70 58 68 58 C 66 58 64 56 64 54 L 64 48 L 40 72 C 38 74 34 74 32 72 Z" fill="url(#champagneGoldGrad)"/>
    <!-- Diamond Dropper Dot -->
    <rect x="22" y="74" width="8" height="8" rx="2" transform="rotate(45 26 78)" fill="url(#champagneGoldGrad)"/>
  </g>

  <!-- Architectural Wordmark POLISH -->
  <text x="355" y="535" 
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
        font-size="124" 
        font-weight="800" 
        letter-spacing="6" 
        text-anchor="middle" 
        fill="url(#champagneGoldGrad)">POLISH</text>
</svg>