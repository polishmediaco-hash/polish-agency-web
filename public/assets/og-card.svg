<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="champagneGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880"/>
      <stop offset="45%" stop-color="#E2C799"/>
      <stop offset="70%" stop-color="#F5E6D3"/>
      <stop offset="100%" stop-color="#E2C799"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#E2C799" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#C5A880" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#080706" stop-opacity="0"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .brand-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Deep Obsidian Noir Canvas -->
  <rect width="1200" height="630" fill="#080706"/>
  <rect width="1200" height="630" fill="url(#centerGlow)"/>

  <!-- Subtle Specular Beveled Rim -->
  <rect x="36" y="36" width="1128" height="558" rx="20" fill="none" stroke="rgba(226, 199, 153, 0.22)" stroke-width="1.5"/>

  <!-- Centered Golden Ratio Mark -->
  <g transform="translate(600, 240) scale(2.4) translate(-50, -50)">
    <g transform="translate(3.5, -5.5)">
      <!-- Upward Kinetic Chevron with Golden Ratio Taper -->
      <path d="M 34 68 
               C 30 64 30 58 34 54 
               L 56 32 
               L 48 32 
               C 45 32 43 30 43 27 
               C 43 24 45 22 48 22 
               L 75 22 
               C 77 22 79 24 79 26 
               L 79 53 
               C 79 56 77 58 74 58 
               C 71 58 69 56 69 53 
               L 69 45 
               L 47 68 
               C 43 72 38 72 34 68 Z" 
            fill="url(#champagneGoldGrad)"/>
      
      <!-- Optically Locked Cosmetic Droplet with Facet Angle -->
      <path d="M 24 72 
               C 27 75 29 79 28 83 
               C 27 87 23 89 19 88 
               C 15 87 13 83 14 79 
               C 15 75 21 69 24 72 Z" 
            fill="url(#champagneGoldGrad)" opacity="0.95"/>
      <!-- Inner Diamond Droplet Core -->
      <rect x="18.5" y="77.5" width="5.5" height="5.5" rx="1.2" transform="rotate(45 21.25 80.25)" fill="#F5E6D3"/>
    </g>
  </g>

  <!-- Typography Lockup -->
  <text x="600" y="425" class="brand-title" font-size="70" letter-spacing="18" text-anchor="middle" fill="url(#champagneGoldGrad)">POLISH</text>
  <text x="600" y="475" class="brand-sub" font-size="18" letter-spacing="14" text-anchor="middle" fill="#C5A880">MEDIA CO</text>
</svg>