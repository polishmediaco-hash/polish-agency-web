        <text x="0" y="320" class="font-brand-title" font-size="14" fill="#E2C799">#E2C799</text>
        <text x="0" y="340" class="font-brand-sub" font-size="11" fill="rgba(245, 230, 211, 0.5)">RGB(226, 199, 153)</text>
      </g>
    
